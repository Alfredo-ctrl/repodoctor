<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="560" viewBox="0 0 1040 560" role="img" aria-labelledby="title desc">
  <title id="title">RepoDoctor terminal preview</title>
  <desc id="desc">A terminal style preview showing a repository score and checklist.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101820"/>
      <stop offset="0.55" stop-color="#1d2f34"/>
      <stop offset="1" stop-color="#2f2418"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="28" stdDeviation="24" flood-color="#081014" flood-opacity="0.34"/>
    </filter>
  </defs>
  <rect width="1040" height="560" fill="#ebe6dc"/>
  <path d="M0 110 C230 18 360 210 570 110 C780 12 850 74 1040 20 L1040 560 L0 560 Z" fill="#d9e4dc"/>
  <rect x="92" y="70" width="856" height="420" rx="18" fill="url(#bg)" filter="url(#shadow)"/>
  <circle cx="126" cy="104" r="9" fill="#e75f50"/>
  <circle cx="154" cy="104" r="9" fill="#f3c14d"/>
  <circle cx="182" cy="104" r="9" fill="#43c36f"/>
  <text x="122" y="164" fill="#f5efe4" font-family="Consolas, monospace" font-size="28" font-weight="700">RepoDoctor</text>
  <text x="122" y="204" fill="#9db3ab" font-family="Consolas, monospace" font-size="18">portfolio readiness check</text>
  <text x="760" y="164" fill="#f4b55f" font-family="Consolas, monospace" font-size="46" font-weight="700">89/100</text>
  <line x1="122" y1="238" x2="890" y2="238" stroke="#60706d" stroke-opacity="0.5"/>
  <g font-family="Consolas, monospace" font-size="22">
    <text x="122" y="292" fill="#89d18a">OK</text><text x="190" y="292" fill="#f5efe4">README and run instructions</text>
    <text x="122" y="336" fill="#89d18a">OK</text><text x="190" y="336" fill="#f5efe4">Screenshots and repository metadata</text>
    <text x="122" y="380" fill="#f1c45b">WARN</text><text x="190" y="380" fill="#f5efe4">Add one repeatable check command</text>
    <text x="122" y="424" fill="#89d18a">OK</text><text x="190" y="424" fill="#f5efe4">No obvious secrets found</text>
  </g>
</svg>
